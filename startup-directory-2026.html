function render(rows){
  const tb=document.getElementById("tbody");
  tb.innerHTML="";
  rows.forEach(([co,desc,dom,amt,round,date],i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="num">${i+1}</td>
      <td class="company">${co}</td>
      <td class="oneliner">${desc}</td>
      <td><span class="badge ${dc[dom]||''}">${dom}</span></td>
      <td class="amount">${amt}</td>
      <td><span class="round-badge ${rc[round]||''}">${round}</span></td>
      <td class="date">${date}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById("cnt").textContent=rows.length+" companies";
}

function filter(){
  const q=document.getElementById("search").value.toLowerCase();
  const d=document.getElementById("domainSel").value;
  const r=document.getElementById("roundSel").value;
  render(D.filter(([co,desc,dom,,round])=>{
    return (!q||co.toLowerCase().includes(q)||desc.toLowerCase().includes(q)||dom.toLowerCase().includes(q))
      &&(!d||dom===d)&&(!r||round===r);
  }));
}

render(D);
